<!doctype html>
<html lang="es" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sant Louis Perfumes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&amp;family=Cormorant+Garamond:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#12231b;--mut:#5d6f66;--line:#dce5e0;--brand:#0f7a55;--on:#fff;--accent:#f2a516;--warn:#b45309;--warnbg:#fef0d6;--bad:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--card:#16211b;--ink:#e8f1ec;--mut:#9aada3;--line:#27372f;--brand:#35c58f;--on:#06231a;--accent:#f5b83d;--warn:#f5b83d;--warnbg:#3a2c0c;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1511;--card:#16211b;--ink:#e8f1ec;--mut:#9aada3;--line:#27372f;--brand:#35c58f;--on:#06231a;--accent:#f5b83d;--warn:#f5b83d;--warnbg:#3a2c0c;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:18px 0 8px}
header h1{margin:0;font-size:34px;font-weight:700;letter-spacing:0;line-height:1.1;display:flex;align-items:center;gap:10px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.logo{height:68px;width:auto;max-width:100%;object-fit:contain;display:block;background:#fff;border-radius:14px;padding:4px 10px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.search{width:100%;margin:10px 0 12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input,select{font:inherit;color:var(--ink)}
.search:focus,.f input:focus,.f select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on);font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.em{flex:none;width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:26px}
.info{flex:1;min-width:0}
.info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mut);font-size:13px}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--warnbg);color:var(--warn)}
.tag.out{background:var(--bad);color:var(--card)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:800;font-size:18px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.card.sold{opacity:.5}
.card .big{font-size:44px;line-height:1.1}
.card b{display:block;margin-top:6px;font-weight:600}
.card .pr{color:var(--brand);font-weight:800;font-size:18px}
.card small{color:var(--mut)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:var(--on);margin-top:10px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.del{background:none;color:var(--bad);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--mut);display:block}
.stat b{font-size:24px;font-weight:800}
h2{font-size:24px;margin:18px 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 4px 8px;font:inherit;font-size:13px;cursor:pointer}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--brand);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:#2a1d00;font-size:30px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:4}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:26px}
.f{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
.f input,.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;display:none}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent);color:#2a1d00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}.bar button{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;background:#2a1d00;color:#fff;cursor:pointer}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--mut);font-size:14px}
.card .btn{padding:9px;margin-top:8px}
.card{cursor:pointer}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.gi{flex:none;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;background:#fff}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--brand);transform:scale(1.3)}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;cursor:pointer;color:#263f65;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#splash.out{opacity:0;pointer-events:none}
#splash .bw{animation:pop .7s ease-out both}
#splash .bee{display:block;width:170px;height:auto}
#splash .sn{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:46px;line-height:1;margin-top:14px;animation:rise .8s .35s ease-out both}
#splash .sp{font-size:13px;letter-spacing:.55em;margin:8px -.55em 0 0;font-weight:500;animation:rise .8s .6s ease-out both}
.wl,.wr{transform-box:view-box}
.wl{transform-origin:66px 52px;animation:fl .15s ease-in-out infinite alternate}
.wr{transform-origin:98px 52px;animation:fr .15s ease-in-out infinite alternate}
@keyframes fl{from{transform:rotate(-2deg)}to{transform:rotate(9deg)}}
@keyframes fr{from{transform:rotate(2deg)}to{transform:rotate(-9deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.wl,.wr,#splash .bee{animation:none}}
.f textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-height:96px;resize:vertical}
.dimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block}
.dd{white-space:pre-wrap;color:var(--mut);margin:0 0 6px}
.em{overflow:hidden}.em img{width:100%;height:100%;object-fit:cover;display:block}
.card .big img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block}
.pick{display:flex;gap:12px;align-items:center;margin-bottom:12px}.pick>div:last-child{flex:1}
</style>
</head>

<script>
var KEY="mi-tienda-borrador-3";
var SRC="<!doctype html>\n"+document.documentElement.outerHTML;
var S={name:"Mi tienda",wa:"",items:[]};
var tab="cat",q="",cat="Todos",OWNER=false,dirty=false;

function seed(){
  return [
    {id:1,em:"💧",name:"Agua 600 ml",cat:"Bebidas",price:2500,cost:1500,stock:24,min:6,show:true},
    {id:2,em:"🍚",name:"Arroz 1 kg",cat:"Despensa",price:4500,cost:3200,stock:3,min:5,show:true},
    {id:3,em:"🥚",name:"Huevos x30",cat:"Despensa",price:18000,cost:15500,stock:8,min:4,show:true},
    {id:4,em:"🍞",name:"Pan tajado",cat:"Panadería",price:6200,cost:4800,stock:0,min:3,show:true}
  ];
}
function load(){
  var d=document.getElementById("data");
  try{S=JSON.parse(d.textContent);}catch(e){}
  if(!S.items)S.items=[];
}
function save(){dirty=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function bar(){return dirty?'<div class="bar"><span>Tienes cambios sin publicar. Tus clientes aún ven la versión anterior.</span><button id="pub">Publicar</button></div>':"";}
async function publish(){
  var b=$("pub");if(b){b.disabled=true;b.textContent="Publicando…";}
  try{
    var art=await claude.use("artifact");
    if(!art){toast("No tienes permiso para publicar");render();return;}
    var json=JSON.stringify(S).replace(/</g,"\\u003c");
    var html=SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,a1,a2){return a1+json+a2;});
    await art.publish(html);
    try{localStorage.removeItem(KEY);}catch(e){}
    dirty=false;render();toast("Catálogo actualizado");
  }catch(e){toast("No se pudo publicar. Intenta de nuevo");render();}
}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ico(i){return i.img?'<img src="'+esc(i.img)+'" alt="">':esc(i.em||"📦");}
function shrink(file,cb){
  var r=new FileReader();
  r.onerror=function(){toast("No se pudo leer esa imagen");};
  r.onload=function(){
    var im=new Image();
    im.onerror=function(){toast("No se pudo leer esa imagen");};
    im.onload=function(){
      var side=Math.min(im.width,im.height),c=document.createElement("canvas");
      c.width=300;c.height=300;
      c.getContext("2d").drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,300,300);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function fmt(n){return "L "+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});}
function $(id){return document.getElementById(id);}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none";},1800);}
function cats(){var c=[];S.items.forEach(function(i){if(i.cat&&c.indexOf(i.cat)<0)c.push(i.cat);});return c;}
function low(i){return i.stock>0&&i.stock<=i.min;}
function byId(id){return S.items.filter(function(i){return i.id==id;})[0];}

function filtered(){
  return S.items.filter(function(i){
    var okq=!q||i.name.toLowerCase().indexOf(q.toLowerCase())>=0;
    var okc=cat==="Todos"||i.cat===cat;
    return okq&&okc;
  });
}

function viewInv(){
  var h='<input class="search" id="q" placeholder="Buscar producto" value="'+esc(q)+'">';
  h+='<div class="chips">';
  ["Todos"].concat(cats()).forEach(function(c){h+='<button class="chip'+(c===cat?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';});
  return h+'</div><div id="list">'+listHtml()+'</div>';
}
function listHtml(){
  var list=filtered();
  var h="";
  if(!list.length)h+='<div class="empty">Aún no hay productos aquí.<br>Toca + para agregar el primero.</div>';
  list.forEach(function(i){
    var tag=i.stock===0?'<span class="tag out">Agotado</span>':(low(i)?'<span class="tag">Poco stock</span>':"");
    h+='<div class="row" data-open="'+i.id+'"><div class="em">'+ico(i)+'</div><div class="info"><b>'+esc(i.name)+'</b><small>'+fmt(i.price)+(i.cat?" · "+esc(i.cat):"")+'</small>'+tag+'</div><div class="qty"><button data-dec="'+i.id+'" aria-label="Restar una unidad">−</button><span>'+i.stock+'</span><button data-inc="'+i.id+'" aria-label="Sumar una unidad">+</button></div></div>';
  });
  return h;
}

function catText(){
  var t="*"+S.name+"*\nCatálogo de productos\n\n";
  S.items.filter(function(i){return i.show!==false&&i.stock>0;}).forEach(function(i){t+=(i.em||"•")+" "+i.name+": "+fmt(i.price)+"\n";});
  return t+"\n¿Quieres hacer un pedido? Escríbenos.";
}
function waLink(i){
  var n=(S.wa||"").replace(/\D/g,"");
  if(!n)return "";
  return "https://wa.me/"+n+"?text="+encodeURIComponent("Hola, quiero pedir: "+i.name+" ("+fmt(i.price)+")");
}
function gridHtml(){
  var list=S.items.filter(function(i){
    return i.show!==false&&(cat==="Todos"||i.cat===cat)&&(!q||i.name.toLowerCase().indexOf(q.toLowerCase())>=0);
  });
  if(!list.length)return '<div class="empty">No hay productos para mostrar.</div>';
  var h='<div class="grid">';
  list.forEach(function(i){
    var l=waLink(i);
    h+='<div class="card'+(i.stock===0?" sold":"")+'" data-det="'+i.id+'"><div class="big">'+ico(i)+'</div><b>'+esc(i.name)+'</b><div class="pr">'+fmt(i.price)+'</div><small>'+(i.stock===0?"Agotado":"Disponible")+(i.desc?" · Ver notas":"")+'</small>'+(l&&i.stock>0?'<a class="btn" target="_blank" rel="noopener" href="'+l+'">Pedir por WhatsApp</a>':"")+'</div>';
  });
  return h+'</div>';
}
function viewCat(){
  var h="";
  if(OWNER)h+='<div class="note">Así ven tu catálogo tus clientes: solo pueden mirar y pedir, no editar. Para compartirlo, usa el botón Compartir de esta página y deja el enlace visible para cualquiera.</div>';
  h+='<input class="search" id="cq" placeholder="Buscar en el catálogo" value="'+esc(q)+'"><div class="chips">';
  ["Todos"].concat(cats()).forEach(function(c){h+='<button class="chip'+(c===cat?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';});
  h+='</div><div id="cgrid">'+gridHtml()+'</div>';
  if(OWNER)h+='<a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(catText())+'">Enviar lista de precios por WhatsApp</a><button class="btn alt" id="copy">Copiar lista de precios</button>';
  return h;
}
function viewCatOld(){
  var list=S.items.filter(function(i){return i.show!==false;});
  var h='<div class="grid">';
  list.forEach(function(i){
    h+='<div class="card'+(i.stock===0?" sold":"")+'"><div class="big">'+esc(i.em||"📦")+'</div><b>'+esc(i.name)+'</b><div class="pr">'+fmt(i.price)+'</div><small>'+(i.stock===0?"Agotado":"Disponible")+'</small></div>';
  });
  h+='</div>';
  if(!list.length)h='<div class="empty">Tu catálogo está vacío.<br>Agrega productos y márcalos para mostrarlos.</div>';
  else{
    h+='<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(catText())+'">Compartir por WhatsApp</a>';
    h+='<button class="btn alt" id="copy">Copiar lista de precios</button>';
  }
  return h;
}

function viewRes(){
  var u=0,cost=0,sale=0,out=[],lw=[];
  S.items.forEach(function(i){u+=i.stock;cost+=i.stock*i.cost;sale+=i.stock*i.price;if(i.stock===0)out.push(i);else if(low(i))lw.push(i);});
  var h='<div class="stats"><div class="stat"><small>Productos</small><b>'+S.items.length+'</b></div><div class="stat"><small>Unidades</small><b>'+u+'</b></div><div class="stat"><small>Inversión en stock</small><b>'+fmt(cost)+'</b></div><div class="stat"><small>Ganancia estimada</small><b>'+fmt(sale-cost)+'</b></div></div>';
  h+='<h2>Por reponer</h2>';
  var need=out.concat(lw);
  if(!need.length)h+='<div class="empty">Todo en orden. Ningún producto con poco stock.</div>';
  need.forEach(function(i){h+='<div class="row" data-open="'+i.id+'"><div class="em">'+ico(i)+'</div><div class="info"><b>'+esc(i.name)+'</b><small>Quedan '+i.stock+' (mínimo '+i.min+')</small></div></div>';});
  h+='<h2>Mi negocio</h2><label class="f">Nombre de la tienda<input id="sname" value="'+esc(S.name)+'"></label><label class="f">WhatsApp para pedidos (con código de país)<input id="swa" inputmode="tel" placeholder="573001234567" value="'+esc(S.wa)+'"></label>';
  return h;
}

function render(){
  $("ttl").innerHTML=S.logo?'<img class="logo" src="'+esc(S.logo)+'" alt="'+esc(S.name)+'">':'<span>'+esc(S.name)+'</span>';
  document.title=S.name;
  $("sub").textContent=!OWNER?"Catálogo de productos":tab==="inv"?"Controla lo que tienes en stock":tab==="cat"?"Lo que verán tus clientes":"Cómo va tu inventario";
  $("fab").style.display=(OWNER&&tab==="inv")?"block":"none";
  document.querySelector("nav").style.display=OWNER?"flex":"none";
  var a=$("app");
  a.innerHTML=!OWNER?viewCat():bar()+(tab==="inv"?viewInv():tab==="cat"?viewCat():viewRes());
  document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab);});
  var qi=$("q");
  if(qi)qi.addEventListener("input",function(){q=qi.value;$("list").innerHTML=listHtml();});
  var sn=$("sname");
  if(sn)sn.addEventListener("change",function(){S.name=sn.value.trim()||"Mi tienda";save();render();});
  var cq=$("cq");if(cq)cq.addEventListener("input",function(){q=cq.value;$("cgrid").innerHTML=gridHtml();});
  var sw=$("swa");if(sw)sw.addEventListener("change",function(){S.wa=sw.value.replace(/\D/g,"");save();render();toast("WhatsApp guardado");});
  var cp=$("copy");
  if(cp)cp.addEventListener("click",function(){
    try{navigator.clipboard.writeText(catText()).then(function(){toast("Lista copiada");},function(){toast("No se pudo copiar");});}catch(e){toast("No se pudo copiar");}
  });
}

function openForm(id){
  var i=id?byId(id):{id:0,em:"📦",name:"",cat:"",price:"",cost:"",stock:0,min:3,show:true};
  var h='<h3>'+(id?"Editar producto":"Nuevo producto")+'</h3>';
  var img=i.img||"";
  h+='<div class="two"><label class="f">Emoji<input id="fe" value="'+esc(i.em)+'" maxlength="4"></label><label class="f">Categoría<input id="fc" list="cl" value="'+esc(i.cat)+'"><datalist id="cl">'+cats().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist></label></div>';
  h+='<label class="f">Nombre<input id="fn" value="'+esc(i.name)+'" placeholder="Ej: Gaseosa 1.5 L"></label>';
  h+='<label class="f">Notas y descripción (opcional)<textarea id="fd" placeholder="Ej: Salida: bergamota. Corazón: jazmín. Fondo: ámbar y vainilla.">'+esc(i.desc||"")+'</textarea></label>';
  h+='<div class="two"><label class="f">Precio de venta<input id="fp" type="number" inputmode="decimal" min="0" value="'+esc(i.price)+'"></label><label class="f">Costo<input id="fk" type="number" inputmode="decimal" min="0" value="'+esc(i.cost)+'"></label></div>';
  h+='<div class="two"><label class="f">Unidades en stock<input id="fs" type="number" inputmode="numeric" min="0" value="'+esc(i.stock)+'"></label><label class="f">Avisar si quedan<input id="fm" type="number" inputmode="numeric" min="0" value="'+esc(i.min)+'"></label></div>';
  h+='<label class="chk"><input type="checkbox" id="fv"'+(i.show!==false?" checked":"")+'> Mostrar en el catálogo</label>';
  h+='<button class="btn" id="fsave">Guardar producto</button>';
  if(id)h+='<button class="btn del" id="fdel">Eliminar producto</button>';
  h+='<button class="btn alt" id="fcancel">Cancelar</button>';
  $("sheet").innerHTML=h;
  $("bg").classList.add("open");
  $("fcancel").onclick=closeForm;
  $("fsave").onclick=function(){
    var name=$("fn").value.trim();
    if(!name){toast("Escribe el nombre del producto");$("fn").focus();return;}
    var o=id?byId(id):{id:Date.now()};
    o.em=$("fe").value.trim()||"📦";o.name=name;o.cat=$("fc").value.trim();
    o.price=Math.max(0,+$("fp").value||0);o.cost=Math.max(0,+$("fk").value||0);
    o.stock=Math.max(0,Math.floor(+$("fs").value||0));o.min=Math.max(0,Math.floor(+$("fm").value||0));
    o.show=$("fv").checked;o.img=img;o.desc=$("fd").value.trim();
    if(!id)S.items.unshift(o);
    save();closeForm();render();toast("Producto guardado");
  };
  if(id)$("fdel").onclick=function(){
    if($("fdel").dataset.sure){S.items=S.items.filter(function(x){return x.id!=id;});save();closeForm();render();toast("Producto eliminado");}
    else{$("fdel").dataset.sure=1;$("fdel").textContent="Toca otra vez para confirmar";}
  };
}
function openDet(id){
  var i=byId(id);if(!i)return;
  var l=waLink(i);
  var im=(i.imgs&&i.imgs.length)?i.imgs:(i.img?[i.img]:[]);
  var h=im.length>1?'<div class="gal" id="gal">'+im.map(function(u){return '<img class="gi" src="'+esc(u)+'" alt="">';}).join("")+'</div><div class="dots">'+im.map(function(u,k){return '<i'+(k?"":' class="on"')+'></i>';}).join("")+'</div>':im.length?'<img class="dimg" src="'+esc(im[0])+'" alt="">':'<div style="text-align:center;font-size:80px">'+esc(i.em||"🧴")+'</div>';
  h+='<h3 style="margin:12px 0 2px">'+esc(i.name)+'</h3><div style="color:var(--brand);font-weight:800;font-size:22px">'+fmt(i.price)+'</div><small style="color:var(--mut)">'+(i.stock===0?"Agotado":"Disponible")+'</small>';
  if(i.desc)h+='<h2>Notas y descripción</h2><div class="dd">'+esc(i.desc)+'</div>';
  if(l&&i.stock>0)h+='<a class="btn" target="_blank" rel="noopener" href="'+l+'">Pedir por WhatsApp</a>';
  h+='<button class="btn alt" id="dclose">Cerrar</button>';
  $("sheet").innerHTML=h;$("bg").classList.add("open");$("dclose").onclick=closeForm;
  var g=$("gal");if(g)g.addEventListener("scroll",function(){var k=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll(".dots i").forEach(function(x,j){x.classList.toggle("on",j===k);});});
}
function closeForm(){$("bg").classList.remove("open");}

document.addEventListener("click",function(e){
  var t=e.target;
  if(t===$("bg")){closeForm();return;}
  if(t.id==="pub"){publish();return;}
  var dc=t.closest("[data-det]");
  if(dc&&!t.closest("a")){openDet(dc.dataset.det);return;}
  if(!OWNER&&!t.closest("[data-cat]"))return;
  var b=t.closest("[data-inc],[data-dec],[data-cat],[data-open],[data-t]");
  if(!b)return;
  if(b.dataset.inc){var p=byId(b.dataset.inc);p.stock++;save();render();return;}
  if(b.dataset.dec){var p2=byId(b.dataset.dec);if(p2.stock>0)p2.stock--;save();render();return;}
  if(b.dataset.cat){cat=b.dataset.cat;render();return;}
  if(b.dataset.t){tab=b.dataset.t;render();window.scrollTo(0,0);return;}
  if(b.dataset.open){openForm(b.dataset.open);}
});
$("fab").addEventListener("click",function(){openForm(0);});
(function(){var s=document.getElementById("splash");if(!s)return;var h=function(){s.classList.add("out");setTimeout(function(){s.remove();},600);};s.addEventListener("click",h);setTimeout(h,3000);})();
load();render();
(async function(){
  try{
    var u=await claude.use("user");
    if(u&&u.isOwner()){
      OWNER=true;tab="inv";
      var dr=null;try{dr=localStorage.getItem(KEY);}catch(e){}
      if(dr&&dr!==JSON.stringify(S)){try{S=JSON.parse(dr);dirty=true;}catch(e){}}
      render();
    }
  }catch(e){}
})();
</script></body></html>
